[project]
name = "naran"
version = "0.1.0"
description = "환경 주장과 공개 데이터의 비교 가능성을 우선 검증하는 사후관리 보조 도구"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11,<1",
    "pydantic>=2.11,<3",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
