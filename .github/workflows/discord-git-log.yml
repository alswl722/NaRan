name: Discord Git Log

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send pushed commits to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMPARE_URL: ${{ github.event.compare }}
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        shell: bash
        run: |
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not configured."
            exit 1
          fi

          commit_lines="$(
            jq -r '
              if length == 0 then
                "커밋 상세 없음"
              else
                .[:10]
                | map(
                    "- [`" + (.id[0:7]) + "`](" + .url + ") "
                    + (.message | split("\n")[0])
                    + " — " + .author.name
                  )
                | join("\n")
              end
            ' <<< "$COMMITS_JSON"
          )"

          commit_count="$(jq 'length' <<< "$COMMITS_JSON")"
          title="📦 ${REPOSITORY} · ${BRANCH}에 ${commit_count}개 커밋"

          payload="$(
            jq -n \
              --arg username "NaRan Git Log" \
              --arg title "$title" \
              --arg description "$commit_lines" \
              --arg url "$COMPARE_URL" \
              --arg actor "$ACTOR" \
              '{
                username: $username,
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $description,
                  color: 5814783,
                  footer: {text: ("pushed by " + $actor)}
                }],
                allowed_mentions: {parse: []}
              }'
          )"

          curl --fail-with-body \
            --retry 3 \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK_URL?wait=true"
